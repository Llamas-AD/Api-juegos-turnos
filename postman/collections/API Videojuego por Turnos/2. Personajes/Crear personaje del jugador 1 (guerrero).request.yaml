$kind: http-request
url: "{{baseUrl}}/characters"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Thor",
      "characterClass": "guerrero"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 201", () => pm.response.to.have.status(201));
      pm.collectionVariables.set("characterId", pm.response.json().id);
    language: text/javascript
order: 1000
