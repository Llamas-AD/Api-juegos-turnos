$kind: http-request
url: "{{baseUrl}}/games/{{gameId}}/actions"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "action": "attack"
    }
auth:
  type: bearer
  credentials:
    token: "{{otherToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 403", () => pm.response.to.have.status(403));
      pm.test("Mensaje", () => pm.expect(pm.response.json().error).to.eql("No es tu turno"));
    language: text/javascript
order: 5000
