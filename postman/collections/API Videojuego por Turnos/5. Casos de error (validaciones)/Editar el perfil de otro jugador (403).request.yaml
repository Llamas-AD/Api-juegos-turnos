$kind: http-request
url: "{{baseUrl}}/players/{{player2Id}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "hack"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: pm.test("Código 403", () => pm.response.to.have.status(403));
    language: text/javascript
order: 5000
