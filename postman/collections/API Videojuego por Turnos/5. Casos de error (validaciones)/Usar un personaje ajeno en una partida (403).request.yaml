$kind: http-request
url: "{{baseUrl}}/games"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "characterId": {{characterId2}}
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: pm.test("Código 403", () => pm.response.to.have.status(403));
    language: text/javascript
order: 6000
