$kind: http-request
url: "{{baseUrl}}/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email1}}",
      "password": "incorrecta"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("Código 401", () => pm.response.to.have.status(401));
    language: text/javascript
order: 2000
