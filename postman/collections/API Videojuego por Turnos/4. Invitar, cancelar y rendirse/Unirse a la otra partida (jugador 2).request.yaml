$kind: http-request
url: "{{baseUrl}}/games/{{gameIdC}}/join"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "characterId": {{characterId2}}
    }
auth:
  type: bearer
  credentials:
    token: "{{token2}}"
scripts:
  - type: afterResponse
    code: pm.test("Código 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
