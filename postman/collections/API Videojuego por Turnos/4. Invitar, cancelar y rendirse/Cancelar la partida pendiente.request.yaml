$kind: http-request
url: "{{baseUrl}}/games/{{gameIdB}}/cancel"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código 200", () => pm.response.to.have.status(200));
      pm.test("Estado cancelada", () => pm.expect(pm.response.json().status).to.eql("cancelada"));
    language: text/javascript
order: 2000
